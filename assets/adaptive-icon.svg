  <rect x="721" y="565" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>

  <!-- WORDOUT label -->
  <text x="512" y="790" font-family="Georgia,serif" font-weight="700" font-size="58" fill="#8B6914" text-anchor="middle" letter-spacing="12">WORDOUT</text>
