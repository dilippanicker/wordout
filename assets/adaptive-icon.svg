  <rect x="721" y="160" width="122" height="122" rx="18" fill="#888780"/>
  <text x="782" y="254" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">E</text>

  <!-- CLOUT: C⬛ L⬛ O🟩 U⬛ T🟩 -->
  <rect x="181" y="295" width="122" height="122" rx="18" fill="#888780"/>
  <text x="242" y="389" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">C</text>

  <rect x="316" y="295" width="122" height="122" rx="18" fill="#888780"/>
  <text x="377" y="389" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">L</text>

  <rect x="451" y="295" width="122" height="122" rx="18" fill="#5BA75A"/>
  <text x="512" y="389" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">O</text>

  <rect x="586" y="295" width="122" height="122" rx="18" fill="#888780"/>
  <text x="647" y="389" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">U</text>

