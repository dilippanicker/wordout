  <!-- Empty rows 3 and 4 -->
  <rect x="181" y="430" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>
  <rect x="316" y="430" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>
  <rect x="451" y="430" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>
  <rect x="586" y="430" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>
  <rect x="721" y="430" width="122" height="122" rx="18" fill="none" stroke="#D3C9B8" stroke-width="4"/>

