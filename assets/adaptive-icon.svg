<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android adaptive icon foreground layer -->
  <!-- Safe zone is central 66% (672x672), content scaled down ~15% with extra padding -->
  <rect width="1024" height="1024" fill="#FFF8EE"/>

  <!-- Tiles scaled to fit safe zone: tile=122px, gap=13px, total=5*122+4*13=662, start x=181 -->
  <!-- Row 1 y=160, Row 2 y=300 -->

  <!-- RAISE: R🟨 A⬛ I⬛ S🟩 E⬛ -->
  <rect x="181" y="160" width="122" height="122" rx="18" fill="#C9A227"/>
  <text x="242" y="254" font-family="Georgia,serif" font-weight="700" font-size="78" fill="white" text-anchor="middle">R</text>

  <rect x="316" y="160" width="122" height="122" rx="18" fill="#888780"/>
