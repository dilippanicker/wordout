<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Splash icon: simplified — 2 rows of tiles (RAISE + CLOUT), no label, no empty rows -->
  <!-- Clean and readable at splash screen sizes -->
  <rect width="1024" height="1024" rx="0" fill="#FFF8EE"/>

  <!-- Centred 2-row board: tile=160px, gap=18px, total w=5*160+4*18=872, startX=76 -->
  <!-- Row 1 y=312, Row 2 y=492, vertical centre = (312+492+160)/2 = 482 ≈ 512 ✓ -->

  <!-- RAISE: R🟨 A⬛ I⬛ S🟩 E⬛ -->
  <rect x="76" y="312" width="160" height="160" rx="24" fill="#C9A227"/>
  <text x="156" y="428" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">R</text>

  <rect x="254" y="312" width="160" height="160" rx="24" fill="#888780"/>
  <text x="334" y="428" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">A</text>

  <rect x="432" y="312" width="160" height="160" rx="24" fill="#888780"/>
  <text x="512" y="428" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">I</text>

  <rect x="610" y="312" width="160" height="160" rx="24" fill="#5BA75A"/>
  <text x="690" y="428" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">S</text>

  <rect x="788" y="312" width="160" height="160" rx="24" fill="#888780"/>
  <text x="868" y="428" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">E</text>

  <!-- CLOUT: C⬛ L⬛ O🟩 U⬛ T🟩 -->
  <rect x="76" y="492" width="160" height="160" rx="24" fill="#888780"/>
  <text x="156" y="608" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">C</text>

  <rect x="254" y="492" width="160" height="160" rx="24" fill="#888780"/>
  <text x="334" y="608" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">L</text>

  <rect x="432" y="492" width="160" height="160" rx="24" fill="#5BA75A"/>
  <text x="512" y="608" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">O</text>

  <rect x="610" y="492" width="160" height="160" rx="24" fill="#888780"/>
  <text x="690" y="608" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">U</text>

  <rect x="788" y="492" width="160" height="160" rx="24" fill="#5BA75A"/>
  <text x="868" y="608" font-family="Georgia,serif" font-weight="700" font-size="104" fill="white" text-anchor="middle">T</text>
</svg>
