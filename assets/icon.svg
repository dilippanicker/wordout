<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: parchment/cream -->
  <rect width="1024" height="1024" rx="180" fill="#FFF8EE"/>

  <!-- RAISE row: R🟨 A⬛ I⬛ S🟩 E⬛ -->
  <!-- 5 tiles, each 148px wide, gap 16px, total = 5*148+4*16 = 804, start x = (1024-804)/2 = 110 -->
  <!-- Row 1 y=190, Row 2 y=370, empty rows y=550,730 -->

  <!-- R - yellow -->
  <rect x="110" y="190" width="148" height="148" rx="22" fill="#C9A227"/>
  <text x="184" y="306" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">R</text>
  <!-- A - grey -->
  <rect x="274" y="190" width="148" height="148" rx="22" fill="#888780"/>
  <text x="348" y="306" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">A</text>
  <!-- I - grey -->
  <rect x="438" y="190" width="148" height="148" rx="22" fill="#888780"/>
  <text x="512" y="306" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">I</text>
  <!-- S - green -->
  <rect x="602" y="190" width="148" height="148" rx="22" fill="#5BA75A"/>
  <text x="676" y="306" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">S</text>
  <!-- E - grey -->
  <rect x="766" y="190" width="148" height="148" rx="22" fill="#888780"/>
  <text x="840" y="306" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">E</text>

  <!-- CLOUT row: C⬛ L⬛ O🟩 U⬛ T🟩 -->
  <!-- C - grey -->
  <rect x="110" y="358" width="148" height="148" rx="22" fill="#888780"/>
  <text x="184" y="474" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">C</text>
  <!-- L - grey -->
  <rect x="274" y="358" width="148" height="148" rx="22" fill="#888780"/>
  <text x="348" y="474" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">L</text>
  <!-- O - green -->
  <rect x="438" y="358" width="148" height="148" rx="22" fill="#5BA75A"/>
  <text x="512" y="474" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">O</text>
  <!-- U - grey -->
  <rect x="602" y="358" width="148" height="148" rx="22" fill="#888780"/>
  <text x="676" y="474" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">U</text>
  <!-- T - green -->
  <rect x="766" y="358" width="148" height="148" rx="22" fill="#5BA75A"/>
  <text x="840" y="474" font-family="Georgia,serif" font-weight="700" font-size="96" fill="white" text-anchor="middle">T</text>

  <!-- Empty rows 3 and 4 -->
  <rect x="110" y="526" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="274" y="526" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="438" y="526" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="602" y="526" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="766" y="526" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>

  <rect x="110" y="694" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="274" y="694" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="438" y="694" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="602" y="694" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>
  <rect x="766" y="694" width="148" height="148" rx="22" fill="none" stroke="#D3C9B8" stroke-width="5"/>

  <!-- WORDOUT label -->
  <text x="512" y="930" font-family="Georgia,serif" font-weight="700" font-size="72" fill="#8B6914" text-anchor="middle" letter-spacing="16">WORDOUT</text>
</svg>
